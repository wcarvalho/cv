research_interests:
  #- My long-term goal is to develop theories for human reinforcement learning and generalization. In particular, I'm interested in how discover and exploit richly structured representations to enable sophisticated behavior and rapid adaptation. Currently, I'm interested in leveraging successor features to provide a unified framework for how brains learn, combine and transfer predictive knowledge and behavior.
  - I aim to build AI that empowers human relationships and human caregiving. My short-term goal is to develop AI systems that learn structured representations of people's intrinsic values and leverage these to help people make deeply fulfilling decisions and provide care for those they care about. My long-term goal is to deploy these systems to empower social and economic mobility for disadvantaged populations. To pursue this, I bring technical training spanning deep reinforcement learning and computational cognitive science. My PhD developed RL agents that transfer learned skills to new situations via structured representations. As a Kempner Fellow at Harvard, I developed computational models of how people make decisions in naturalistic settings.
  #To accomplish this, I integrate fields that think about natural and artificial intelligence, and fields that that study the relationship between technology and society.


